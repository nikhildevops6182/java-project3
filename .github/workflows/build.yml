name: Java Application Build and Kubernetes Deploy

on:
push:
branches:
\- main

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: temurin
      cache: maven

  - name: Maven Clean Package
    run: mvn clean package

  - name: Docker Login
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Docker Build
    run: |
      docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/springboot-maven-poc:v1 \
        -t ${{ secrets.DOCKER_USERNAME }}/springboot-maven-poc:sha-${GITHUB_SHA} .

  - name: Docker Push
    run: |
      docker push ${{ secrets.DOCKER_USERNAME }}/springboot-maven-poc:v1
      docker push ${{ secrets.DOCKER_USERNAME }}/springboot-maven-poc:sha-${GITHUB_SHA}

  - name: Configure Kubernetes kubeconfig
    run: |
      mkdir -p "$HOME/.kube"
      echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"
      chmod 600 "$HOME/.kube/config"
      kubectl config current-context
      kubectl get nodes

  - name: Deploy Kubernetes YAML files
    run: |
      kubectl apply -f deployment.yml
      kubectl apply -f service.yml

      kubectl get services
```

